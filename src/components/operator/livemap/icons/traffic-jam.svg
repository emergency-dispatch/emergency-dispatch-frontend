<!-- Điểm ùn tắc — phương án 2B "Dòng xe · khối đặc" theo ảnh mẫu người dùng (chốt 2026-11-12): 5 xe nhìn thẳng xếp chiều sâu
     (2 xa, 2 giữa, 1 gần) + 2 vạch mép đường. Xe gần che xe xa, khe hở 1.2 tạo bằng mask.
     Lưới 24×24, một màu; code tô màu qua currentColor (cam = chưa có đội, xanh = đang giải tỏa, đỏ = tê liệt quá ngưỡng). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <path id="tj-car" fill-rule="evenodd" d="M7.4 5h9.2a2 2 0 0 1 1.9 1.4L19.6 10H20a1.5 1.5 0 0 1 1.5 1.5V16a1 1 0 0 1-1 1H20v1.5a1 1 0 0 1-1 1h-1.6a1 1 0 0 1-1-1V17H7.6v1.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V17h-.5a1 1 0 0 1-1-1v-4.5A1.5 1.5 0 0 1 4 10h.4l1.1-3.6A2 2 0 0 1 7.4 5Z M7.6 7h8.8l.9 3H6.7Z M5.2 13.4a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0Z M16.2 13.4a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0Z"/>
    <mask id="tj-m-back" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="2.5" y="5" width="19" height="14.5" rx="2.5" fill="#000" stroke="#000" stroke-width="3" transform="translate(5.8 10.6) scale(.4) translate(-12 -12.25)"/>
      <rect x="2.5" y="5" width="19" height="14.5" rx="2.5" fill="#000" stroke="#000" stroke-width="3" transform="translate(18.2 10.6) scale(.4) translate(-12 -12.25)"/>
      <rect x="2.5" y="5" width="19" height="14.5" rx="2.5" fill="#000" stroke="#000" stroke-width="2.3" transform="translate(12 14.4) scale(.52) translate(-12 -12.25)"/>
    </mask>
    <mask id="tj-m-mid" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="2.5" y="5" width="19" height="14.5" rx="2.5" fill="#000" stroke="#000" stroke-width="2.3" transform="translate(12 14.4) scale(.52) translate(-12 -12.25)"/>
    </mask>
  </defs>
  <g mask="url(#tj-m-back)" fill="currentColor">
    <use href="#tj-car" xlink:href="#tj-car" transform="translate(8.3 5.3) scale(.32) translate(-12 -12.25)"/>
    <use href="#tj-car" xlink:href="#tj-car" transform="translate(15.7 6) scale(.32) translate(-12 -12.25)"/>
  </g>
  <g mask="url(#tj-m-mid)" fill="currentColor">
    <use href="#tj-car" xlink:href="#tj-car" transform="translate(5.8 10.6) scale(.4) translate(-12 -12.25)"/>
    <use href="#tj-car" xlink:href="#tj-car" transform="translate(18.2 10.6) scale(.4) translate(-12 -12.25)"/>
  </g>
  <use href="#tj-car" xlink:href="#tj-car" fill="currentColor" transform="translate(12 14.4) scale(.52) translate(-12 -12.25)"/>
  <path d="M5 18.8 3.4 21.6 M19 18.8l1.6 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg>
